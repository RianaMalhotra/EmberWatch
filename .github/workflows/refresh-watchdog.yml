name: FIRMS refresh watchdog
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  check-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Alert if scheduled refresh has not succeeded recently
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime, timezone
          url = f"https://api.github.com/repos/{os.environ['REPO']}/actions/workflows/refresh-detections.yml/runs?per_page=30&status=completed"
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "User-Agent": "EmberWatch-refresh-watchdog",
          })
          with urllib.request.urlopen(req, timeout=20) as response:
              runs = json.load(response).get("workflow_runs", [])
          successful = [r for r in runs if r.get("conclusion") == "success"]
          if not successful:
              print("::error::No successful FIRMS refresh in recent workflow history")
              sys.exit(1)
          last = max(datetime.fromisoformat(r["updated_at"].replace("Z","+00:00")) for r in successful)
          age = (datetime.now(timezone.utc) - last).total_seconds() / 3600
          print(f"Last successful FIRMS refresh completed {age:.1f} hours ago")
          if age > 7:
              print(f"::error::FIRMS refresh stale ({age:.1f} hours); investigate API, DB, or workflow errors")
              sys.exit(1)
          PY
